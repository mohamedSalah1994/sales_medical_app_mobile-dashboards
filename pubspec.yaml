name: sales_medical_app_mobile
description: "DKT Sales APP"
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.7
  google_fonts: ^6.2.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  bot_toast: ^4.0.3
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5
  android_intent_plus: ^5.3.0
  geolocator: ^13.0.1
  geolocator_android: ^4.6.0
  geolocator_apple: ^2.3.7
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  google_maps_flutter: ^2.10.0
  latlong2: ^0.9.1
  geocoding: ^4.0.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  # Charting on mobile (same version as the web app).
  fl_chart: ^0.69.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/DKT_Logo.png
    background_color: "#F4F4F5"
    theme_color: "#C41C20"
  image_path: assets/images/DKT_Logo.png
  adaptive_icon_background: "#F4F4F5"
  adaptive_icon_foreground: assets/images/DKT_Logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/DKT_Logo.png

  # Enable code generation for localization
  generate: true
